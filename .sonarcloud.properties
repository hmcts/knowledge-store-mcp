# The contract stores, and the older releases' stores under frozen/, are
# knowledge-store-builder's output, committed so the tests can read it
# (tests/library_store/generate.py). They are not this repository's code: the
# library's explorer page and the near-identical store/ and no-index/ copies
# would otherwise be scored as ours.
sonar.exclusions=tests/library_store/store/**,tests/library_store/no-index/**,tests/library_store/frozen/**
sonar.cpd.exclusions=tests/library_store/store/**,tests/library_store/no-index/**,tests/library_store/frozen/**
