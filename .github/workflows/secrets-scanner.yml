name: Secrets Scanner

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 4 * * 4' # Every Thursday at 04:00
  workflow_dispatch:

# The scanner only reads the checkout: it posts no PR comments
# (GITLEAKS_ENABLE_COMMENTS is false inside the action).
permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # History is scanned too, so a secret removed from a file is still
          # found in the commit that added it.
          fetch-depth: 0

      - uses: hmcts/secrets-scanner@v1.3.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          gitleaks_license: ${{ secrets.GITLEAKS_LICENSE }}
