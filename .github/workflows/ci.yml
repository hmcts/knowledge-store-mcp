name: CI

# Lint, format, type-check and test. No paths-ignore, so the check always
# reports and can be made required without deadlocking docs-only pull requests.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # One job definition, two interpreters. The matrix entry's `name` is the whole
  # check name, so the 3.14 entry reports exactly "Lint and tests", the check
  # branch protection requires, and a plain matrix (which would rename it
  # "Lint and tests (3.14)") is avoided. The floor entry reports separately and
  # is not required. 3.14 is what .python-version names; 3.13 is requires-python.
  tests:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Lint and tests
            python: "3.14"
          - name: Lint and tests on the Python floor
            python: "3.13"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1

      # Until pyproject.toml lands there is nothing to check. The job still
      # succeeds, so it reports, and it starts checking on the commit that adds
      # the package, with no change here.
      - name: Check for the package
        id: project
        run: |
          if [ -f pyproject.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "No pyproject.toml yet: nothing to check."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install uv
        if: steps.project.outputs.present == 'true'
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}

      # --frozen installs exactly what uv.lock resolves. The dev tools live in
      # [dependency-groups] dev, which uv sync installs by default. --no-build
      # refuses to run any dependency's build scripts: every dependency is a
      # wheel, and uv still builds this project itself. Each `uv run` repeats it
      # because Sonar reads the command line, not what --no-sync already implies.
      - name: Install
        if: steps.project.outputs.present == 'true'
        run: uv sync --frozen --no-build

      # A pin that silently failed must turn the job red, not test the wrong Python.
      - name: Check the interpreter
        if: steps.project.outputs.present == 'true'
        run: |
          uv run --no-sync --no-build python -c "import sys; v='%d.%d' % sys.version_info[:2]; print(sys.version); assert v == '${{ matrix.python }}', v"

      - name: Ruff lint
        if: steps.project.outputs.present == 'true'
        run: uv run --no-sync --no-build ruff check . --output-format=github

      - name: Ruff format check
        if: steps.project.outputs.present == 'true'
        run: uv run --no-sync --no-build ruff format --check .

      - name: Pyright
        if: steps.project.outputs.present == 'true'
        run: uv run --no-sync --no-build pyright

      - name: Tests
        if: steps.project.outputs.present == 'true'
        run: uv run --no-sync --no-build python -m unittest discover -s tests -v
