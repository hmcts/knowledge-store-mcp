name: CI

# Lint, format, type-check and test. No paths-ignore, so the check always
# reports and can be made required without deadlocking docs-only pull requests.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: Lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1

      # Until pyproject.toml lands there is nothing to check. The job still
      # succeeds, so it reports, and it starts checking on the commit that adds
      # the package, with no change here.
      - name: Check for the package
        id: project
        run: |
          if [ -f pyproject.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "No pyproject.toml yet: nothing to check."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install uv
        if: steps.project.outputs.present == 'true'
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      # --frozen installs exactly what uv.lock resolves. The dev tools live in
      # [dependency-groups] dev, which uv sync installs by default.
      - name: Install
        if: steps.project.outputs.present == 'true'
        run: uv sync --frozen

      - name: Ruff lint
        if: steps.project.outputs.present == 'true'
        run: uv run --no-sync ruff check . --output-format=github

      - name: Ruff format check
        if: steps.project.outputs.present == 'true'
        run: uv run --no-sync ruff format --check .

      - name: Pyright
        if: steps.project.outputs.present == 'true'
        run: uv run --no-sync pyright

      - name: Tests
        if: steps.project.outputs.present == 'true'
        run: uv run --no-sync python -m unittest discover -s tests -v
